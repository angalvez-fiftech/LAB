name: Liquibase MySQL CI

on:
  push:
    branches:
      - main

jobs:
  migrate-database:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: mydatabase
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download MySQL Driver
        run: wget https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.0.33/mysql-connector-j-8.0.33.jar -O mysql-connector-j.jar

      - name: Run Liquibase Migration
        uses: liquibase/liquibase-github-action@v4
        with:
          operation: 'update'
          classpath: 'mysql-connector-j.jar'
          changeLogFile: 'liquibase/changelog/changelog-master.xml'
          url: 'jdbc:mysql://127.0.0.1:3306/mydatabase'
          username: 'root'
          password: ${{ secrets.DB_PASSWORD }}
          driver: 'com.mysql.cj.jdbc.Driver'